name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: .NET info
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH=$PATH"
        which dotnet || true
        dotnet --info
        dotnet --list-sdks

    - name: Install librdkafka
      run: sudo apt-get update && sudo apt-get install -y librdkafka-dev
        
    - name: Restore dependencies
      run: dotnet restore

    - name: Snyk test (dependencies)
      uses: snyk/actions/dotnet@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test
        args: --all-projects --severity-threshold=high
      
    - name: Build
      run: dotnet build --no-restore --configuration Release /p:ContinuousIntegrationBuild=true

    - name: Test
      shell: bash
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
      run: |
        set -euo pipefail
        mkdir -p ./TestResults
        dotnet test ./tests/JohBloch.ConfluentKafka.Clients.Tests.csproj \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --settings ./tests/vstest.runsettings \
          --results-directory ./TestResults \
          --logger "trx;LogFileName=test-results.trx" \
          --diag ./TestResults/vstest.diag.log \
          --blame-crash \
          --blame-crash-dump-type full \
          --blame-hang \
          --blame-hang-timeout 5m

    - name: Snyk monitor (snapshot on main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: snyk/actions/dotnet@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor
        args: --all-projects
      
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: success() || failure()
      with:
        name: Test Results
        path: '**/TestResults/**/test-results.trx'
        reporter: dotnet-trx

    - name: Upload TestResults (including blame)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: testresults
        path: '**/TestResults/**'
      

