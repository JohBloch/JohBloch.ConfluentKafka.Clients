name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: .NET info
      shell: bash
      run: dotnet --info

    - name: Install librdkafka
      run: sudo apt-get update && sudo apt-get install -y librdkafka-dev
        
    - name: Restore dependencies
      run: dotnet restore

    - name: Snyk test (dependencies)
      uses: snyk/actions/dotnet@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test
        args: --all-projects --severity-threshold=high
      
    - name: Build
      run: dotnet build --no-restore --configuration Release /p:ContinuousIntegrationBuild=true

    - name: Test
      run: dotnet test ./tests/JohBloch.ConfluentKafka.Clients.Tests.csproj --configuration Release --verbosity normal --blame --logger "trx;LogFileName=test-results.trx"

    - name: Snyk monitor (snapshot on main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: snyk/actions/dotnet@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor
        args: --all-projects
      
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: success() || failure()
      with:
        name: Test Results
        path: '**/test-results.trx'
        reporter: dotnet-trx

    - name: Upload TestResults (including blame)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: testresults
        path: '**/TestResults/**'
      

