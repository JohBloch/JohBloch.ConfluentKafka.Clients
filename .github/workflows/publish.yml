name: Publish NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate release tag (stable SemVer only)
      shell: bash
      run: |
        echo "GITHUB_REF=${GITHUB_REF}"
        echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
        if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "ERROR: This workflow only publishes on stable tags like v1.2.3 (no prerelease)."
          exit 1
        fi
    
    - name: Setup .NET (global.json)
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: .NET info
      shell: bash
      run: dotnet --info
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

    - name: Inspect native dependencies (bundled librdkafka)
      shell: bash
      run: |
        set -euo pipefail
        echo "Searching for librdkafka native binaries..."
        find . -type f \( -name "librdkafka*.so" -o -name "librdkafka*.so.*" \) -print || true
        echo "Running ldd (if any were found)..."
        while IFS= read -r sofile; do
          echo "--- ldd $sofile ---"
          ldd "$sofile" || true
        done < <(find . -type f \( -name "librdkafka*.so" -o -name "librdkafka*.so.*" \) -print)
      
    - name: Test
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./TestResults
        dotnet test ./tests/JohBloch.ConfluentKafka.Clients.Tests.csproj \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --settings ./tests/vstest.runsettings \
          --results-directory ./TestResults \
          --diag ./TestResults/vstest.diag.log \
          --blame-crash \
          --blame-crash-dump-type full \
          --blame-hang \
          --blame-hang-timeout 5m

    - name: Upload TestResults (including blame)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: testresults
        path: TestResults/
      
    - name: Pack
      shell: bash
      run: |
        set -euo pipefail
        rm -rf ./artifacts
        mkdir -p ./artifacts

        projects=(
          "./src/JohBloch.ConfluentKafka.Clients.Core/JohBloch.ConfluentKafka.Clients.Core.csproj"
          "./src/JohBloch.ConfluentKafka.Clients.Consumer/JohBloch.ConfluentKafka.Clients.Consumer.csproj"
          "./src/JohBloch.ConfluentKafka.Clients.Producer/JohBloch.ConfluentKafka.Clients.Producer.csproj"
          "./src/JohBloch.ConfluentKafka.Clients/JohBloch.ConfluentKafka.Clients.csproj"
        )

        for p in "${projects[@]}"; do
          echo "Packing ${p}..."
          dotnet pack "${p}" --configuration Release --no-build --output ./artifacts /p:ContinuousIntegrationBuild=true
        done

        echo "Artifacts:"
        ls -la ./artifacts
      
    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Push Symbols to NuGet
      run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
